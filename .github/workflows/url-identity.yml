name: Offline URL identity regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  url-identity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      STATE_BACKEND: file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==8.2.0 thefuzz==0.22.1 python-dotenv==1.0.1 requests==2.31.0 pytz==2024.1
      - run: python -m pytest -q tests/test_url_identity.py
      - run: python -m compileall -q utils scraper
